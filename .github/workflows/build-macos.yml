name: Build macOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    env:
      LICENSE_PRODUCT_CODE: metalizer
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify license public key
        shell: bash
        run: |
          if [ -z "$LICENSE_PUBLIC_KEY" ]; then
            echo "::error::Repository secret LICENSE_PUBLIC_KEY is not configured."
            exit 1
          fi

      - name: Build Tauri application (Apple Silicon)
        if: matrix.target == 'aarch64-apple-darwin'
        run: >-
          npm run tauri build -- --target ${{ matrix.target }} --bundles dmg,app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Tauri application (Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg,app

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: metalizer-macos-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
