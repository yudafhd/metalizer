[package]
name = "adobe-stock-metadata-generator"
version = "0.2.0"
description = "A local-first batch metadata generator for Adobe Stock contributors"
authors = ["Yuda Fhd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "adobe_stock_metadata_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
guardian-core = { git = "https://github.com/yudafhd/guardian-core", rev = "db6ba26a84447baff26fdcde195afbf1aeeb8e34" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
resvg = "0.45"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"
csv = "1.3"
zeroize = { version = "1", features = ["zeroize_derive"] }
tracing = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev.package.scrypt]
opt-level = 3
