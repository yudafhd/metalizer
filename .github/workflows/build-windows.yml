name: Build Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      LICENSE_PRODUCT_CODE: metalizer
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify license public key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_PUBLIC_KEY)) {
            throw "Repository secret LICENSE_PUBLIC_KEY is not configured."
          }

      - name: Build Tauri application
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: metalizer-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
